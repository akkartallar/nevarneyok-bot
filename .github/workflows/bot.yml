name: Ne Var Ne Yok Botu
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 10 * * *'
    - cron: '0 17 * * *'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: sudo apt-get install ffmpeg -y
      - run: python main.py
      - uses: actions/upload-artifact@v4
        with:
          name: videom
          path: video.mp4
